<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mafia Wiki</title>
<meta name="description" content="The Mafia wiki: roles, factions and how to play Mafia, an online social deduction game on Scratch.">
<style>
  :root { --rain:#2b3239; --deep:#1a1f24; --bar:#6f6f6f; --paper:#fff; --soft:#c9d0d6;
          --serif:"Times New Roman",Times,Georgia,serif; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--paper); font-family:var(--serif); font-size:1.15rem; line-height:1.6; min-height:100vh;
    background:repeating-linear-gradient(100deg,rgba(255,255,255,.035) 0 1px,transparent 1px 11px),linear-gradient(180deg,var(--rain),var(--deep));
    background-attachment:fixed; }
  a { color:#9fd0ff; } a.missing { color:#ff9a9a; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid #ffd84d; outline-offset:2px; }
  .shell { display:flex; max-width:1100px; margin:0 auto; gap:2rem; padding:1.5rem; }
  nav { flex:0 0 13rem; position:sticky; top:1.5rem; align-self:flex-start; }
  nav .brand { font-size:2.2rem; font-weight:700; margin:0 0 1rem; line-height:1; }
  nav a { display:block; padding:.5rem .8rem; margin-bottom:.35rem; color:var(--paper); text-decoration:none; font-weight:700; border:3px solid transparent; border-radius:6px; }
  nav a:hover { border-color:var(--soft); }
  nav a[aria-current="page"] { border-color:var(--paper); background:rgba(255,255,255,.12); }
  main { flex:1; min-width:0; max-width:46rem; }
  h1,h2,h3,h4 { line-height:1.15; margin:0 0 .8rem; }
  h1 { font-size:clamp(2.4rem,7vw,4rem); letter-spacing:-.02em; }
  h2 { font-size:1.9rem; margin-top:1.8rem; border-bottom:2px solid rgba(255,255,255,.3); padding-bottom:.2rem; }
  h3 { font-size:1.45rem; margin-top:1.4rem; } h4 { font-size:1.2rem; margin-top:1.2rem; }
  p { margin:0 0 1rem; } ul,ol { margin:0 0 1rem; padding-left:1.6rem; } hr { border:0; border-top:2px solid rgba(255,255,255,.3); margin:1.5rem 0; }
  .tabs { display:flex; gap:.5rem; margin-bottom:1rem; }
  .tabs a { padding:.2rem .8rem; border:3px solid var(--soft); border-radius:6px; text-decoration:none; color:var(--paper); font-weight:700; font-size:1rem; }
  .tabs a[aria-current="page"] { background:rgba(255,255,255,.14); border-color:var(--paper); }
  .infobox { float:right; width:15rem; margin:0 0 1rem 1.2rem; border:3px solid var(--paper); border-radius:8px; overflow:hidden; background:rgba(0,0,0,.28); font-size:1rem; }
  .infobox .ib-title { padding:.5rem .8rem; font-size:1.5rem; font-weight:700; text-shadow:0 1px 2px rgba(0,0,0,.5); background:linear-gradient(90deg,var(--bar) 55%,var(--c,#6f6f6f)); }
  .infobox dl { margin:0; padding:.5rem .8rem; } .infobox dt { font-weight:700; margin-top:.4rem; } .infobox dd { margin:0; }
  .cats { clear:both; margin-top:2rem; padding-top:.8rem; border-top:2px solid rgba(255,255,255,.3); color:var(--soft); font-size:1rem; }
  .btn { display:inline-block; margin:.3rem .4rem .3rem 0; padding:.5rem 1.2rem; font:700 1.15rem var(--serif); color:#fff; cursor:pointer; text-decoration:none;
         background:linear-gradient(90deg,var(--bar) 55%,#2fa12f); border:3px solid var(--paper); border-radius:6px; }
  nav a, .btn, .tabs a { transition:transform .15s ease, border-color .15s ease; }
  nav a:nth-of-type(odd):hover, nav a:nth-of-type(odd):focus-visible { transform:rotate(-2.5deg) scale(1.04); }
  nav a:nth-of-type(even):hover, nav a:nth-of-type(even):focus-visible { transform:rotate(2.5deg) scale(1.04); }
  .btn:hover, .btn:focus-visible { transform:rotate(-2deg) scale(1.06); }
  .tabs a:hover { transform:rotate(-2deg) scale(1.04); }
  @media (prefers-reduced-motion:reduce) { nav a,.btn,.tabs a { transition:none; } nav a:hover,.btn:hover,.tabs a:hover,nav a:focus-visible,.btn:focus-visible { transform:none; } }
  label { display:block; margin:0 0 1rem; font-weight:700; }
  input, textarea { display:block; width:100%; margin-top:.3rem; padding:.5rem .7rem; font:inherit; color:var(--paper); background:rgba(0,0,0,.35); border:3px solid var(--paper); border-radius:6px; }
  textarea { resize:vertical; font-family:Consolas,"Courier New",monospace; font-size:1rem; }
  .preview { margin-top:1.5rem; padding:1rem; border:3px dashed var(--soft); border-radius:8px; } .preview:empty { display:none; }
  .help { color:var(--soft); font-size:1rem; } .help code { background:rgba(0,0,0,.35); padding:0 .3rem; border-radius:4px; }
  #status { min-height:1.6em; color:var(--soft); font-size:1rem; }
  .search { position:relative; margin:0 0 1rem; }
  .search input { margin:0; border-radius:999px; padding:.45rem 1rem; font-size:1rem; }
  #suggest { position:absolute; z-index:5; left:0; right:0; margin:.3rem 0 0; padding:0; list-style:none; background:var(--deep); border:3px solid var(--paper); border-radius:8px; overflow:hidden; }
  #suggest:empty { display:none; }
  #suggest a { display:block; padding:.4rem 1rem; color:var(--paper); text-decoration:none; border:0; border-radius:0; margin:0; font-weight:400; }
  #suggest a:hover, #suggest a:focus-visible { background:rgba(255,255,255,.15); transform:none; }
  .card { margin:0 0 .9rem; border:3px solid var(--paper); border-radius:8px; overflow:hidden; }
  .card .head { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; padding:.55rem 1rem; font-size:1.5rem; font-weight:700; color:#fff; text-decoration:none;
    background:linear-gradient(90deg,var(--bar) 60%,#2fa12f); text-shadow:0 1px 2px rgba(0,0,0,.45); }
  .card .head small { font-size:1rem; font-weight:400; }
  .card .body { padding:.7rem 1rem; background:rgba(0,0,0,.3); font-size:1rem; }
  mark { background:#ffd84d; color:#222; border-radius:3px; padding:0 .15rem; }
  footer { margin-top:3rem; color:var(--soft); font-size:1rem; clear:both; }
  @media (max-width:760px) { .shell { flex-direction:column; gap:1rem; padding:1rem; } nav { position:static; flex:none; } nav a { display:inline-block; } .infobox { float:none; width:100%; margin:0 0 1rem; } }
</style>
</head>
<body>
<div class="shell">
  <nav aria-label="Wiki">
    <p class="brand">Mafia</p>
    <div class="search">
      <input id="q" type="search" placeholder="Search pages" aria-label="Search pages" autocomplete="off">
      <ul id="suggest" aria-label="Suggestions"></ul>
    </div>
    <a href="#Main_Page" data-t="Main Page">Main Page</a>
    <a href="#How_to_Play" data-t="How to Play">How to Play</a>
    <a href="#Factions" data-t="Factions">Factions</a>
    <a href="#Roles" data-t="Roles">Roles</a>
    <a href="#Special:AllPages" data-t="Special:AllPages">All pages</a>
    <a href="#Special:NewPage" data-t="Special:NewPage">Add a page</a>
  </nav>
  <main>
    <p id="status" role="status"></p>
    <div id="view"></div>
    <footer>Mafia is made by Daylight Studios. Currently in beta. Advertising is not allowed.</footer>
  </main>
</div>

<script>
/* ------------------------------------------------------------------ wikitext */
var pages = {};   // normalised title -> { title, text, author }

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function unesc(s) { return s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&amp;/g,"&"); }
function norm(t) { t = t.replace(/_/g," ").replace(/\s+/g," ").trim(); return t.charAt(0).toUpperCase() + t.slice(1); }
function slug(t) { return encodeURIComponent(norm(t).replace(/ /g,"_")).replace(/%3A/gi,":").replace(/%2F/gi,"/").replace(/%28/g,"(").replace(/%29/g,")"); }
function pageExists(key) { return !!pages[key] || /^(Special|Category):/.test(key); }

function inline(s) {
  s = esc(s);
  s = s.replace(/\[\[([^\[\]|]+?)(?:\|([^\[\]]+?))?\]\]/g, function (m, t, label) {
    t = unesc(t); var key = norm(t);
    return '<a href="#' + slug(key) + '"' + (pageExists(key) ? "" : ' class="missing"') + ">" + (label || esc(t)) + "</a>";
  });
  s = s.replace(/\[(https?:\/\/[^\s\]]+)(?:\s+([^\]]+))?\]/g, function (m, u, label) {
    return '<a href="' + u + '" target="_blank" rel="noopener nofollow ugc">' + (label || u) + "</a>";
  });
  s = s.replace(/'''(.+?)'''/g, "<b>$1</b>").replace(/''(.+?)''/g, "<i>$1</i>");
  return s;
}

function extractCats(text) {
  var cats = [], re = /\[\[\s*Category:([^\]|]+)(?:\|[^\]]*)?\]\]/gi, m;
  while ((m = re.exec(text))) cats.push(norm(m[1]));
  return cats;
}

function infobox(body) {
  var color = "#6f6f6f", title = "", rows = [];
  // Keep the "|" inside [[Page|label]] links from being read as a field separator.
  body = body.replace(/\[\[[^\]]*\]\]/g, function (m) { return m.replace(/\|/g, "\u0001"); });
  body.split(/\n?\s*\|/).forEach(function (seg) {
    var i = seg.indexOf("="); if (i < 0) return;
    var k = seg.slice(0, i).trim().toLowerCase(), v = seg.slice(i + 1).replace(/\u0001/g, "|").trim();
    if (!v) return;
    if (k === "color") { if (/^#[0-9a-f]{3,8}$/i.test(v)) color = v; }
    else if (k === "name") title = v;
    else rows.push("<dt>" + esc(k.charAt(0).toUpperCase() + k.slice(1)) + "</dt><dd>" + inline(v) + "</dd>");
  });
  return '<aside class="infobox" style="--c:' + color + '"><div class="ib-title">' + esc(title) + "</div><dl>" + rows.join("") + "</dl></aside>";
}

function render(text) {
  var boxes = [], out = [], para = [], stack = [];
  var cats = extractCats(text);
  text = text.replace(/\[\[\s*Category:[^\]]*\]\]/gi, "");
  text = text.replace(/\{\{\s*Infobox[^\n|}]*([\s\S]*?)\}\}/gi, function (m, body) { boxes.push(infobox(body)); return "\n"; });

  function flushPara() { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } }
  function closeLists() { while (stack.length) out.push("</li></" + stack.pop() + ">"); }

  text.split("\n").forEach(function (line) {
    var m;
    if ((m = /^([*#]+)\s*(.*)$/.exec(line))) {
      flushPara();
      var depth = m[1].length, tag = m[1].charAt(depth - 1) === "#" ? "ol" : "ul";
      if (depth > stack.length) { while (stack.length < depth) { stack.push(tag); out.push("<" + tag + "><li>"); } }
      else { while (stack.length > depth) out.push("</li></" + stack.pop() + ">"); out.push("</li><li>"); }
      out.push(inline(m[2]));
      return;
    }
    closeLists();
    if ((m = /^(={2,4})\s*(.+?)\s*\1\s*$/.exec(line))) { flushPara(); var n = m[1].length; out.push("<h" + n + ">" + inline(m[2]) + "</h" + n + ">"); }
    else if (/^----+\s*$/.test(line)) { flushPara(); out.push("<hr>"); }
    else if (!line.trim()) flushPara();
    else para.push(line.trim());
  });
  flushPara(); closeLists();
  return { html: boxes.join("") + out.join("\n"), cats: cats };
}

/* ------------------------------------------------------------------ search */
function plain(t) {
  return t.replace(/\{\{[\s\S]*?\}\}/g, " ").replace(/\[\[\s*Category:[^\]]*\]\]/gi, " ")
    .replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, "$1").replace(/\[https?:\/\/\S+\s*([^\]]*)\]/g, "$1")
    .replace(/'{2,3}/g, "").replace(/^=+\s*|\s*=+\s*$/gm, "").replace(/^[*#]+\s*/gm, "").replace(/\s+/g, " ").trim();
}
function snippet(body, i, len) {
  if (i < 0) return esc(body.slice(0, 140));
  var s = Math.max(0, i - 60), e = Math.min(body.length, i + len + 80);
  return (s ? "\u2026" : "") + esc(body.slice(s, i)) + "<mark>" + esc(body.slice(i, i + len)) + "</mark>" + esc(body.slice(i + len, e)) + (e < body.length ? "\u2026" : "");
}
function searchPages(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  var words = q.split(/\s+/), res = [];
  Object.keys(pages).forEach(function (k) {
    var p = pages[k], t = p.title.toLowerCase(), body = plain(p.text), b = body.toLowerCase(), score = 0, at = -1, len = q.length;
    if (t === q) score = 100; else if (t.indexOf(q) === 0) score = 80; else if (t.indexOf(q) >= 0) score = 60;
    at = b.indexOf(q);
    if (at >= 0) score += 10;
    if (!score && words.every(function (w) { return (t + " " + b).indexOf(w) >= 0; })) {
      score = 5; at = b.indexOf(words[0]); len = words[0].length;
    }
    if (score) res.push({ title: p.title, score: score, snippet: snippet(body, at, len), cats: extractCats(p.text) });
  });
  res.sort(function (a, b) { return b.score - a.score || a.title.localeCompare(b.title); });
  return res;
}
// ---- DOM ----
/* -------------------------------------------------------------------- app */
var POINTER = "https://raw.githubusercontent.com/Daylight-Studios-Scratch/Mafia/refs/heads/main/Backend%20HTTP.txt";
var backendUrl = null;
var view = document.getElementById("view"), statusEl = document.getElementById("status");

function getBackend() {
  if (backendUrl) return Promise.resolve(backendUrl);
  return fetch(POINTER, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("pointer"); return r.text(); })
    .then(function (t) {
      t = t.trim().replace(/\/+$/, "");
      if (!/^https:\/\/[^\s]+$/.test(t)) throw new Error("bad address");
      return (backendUrl = t);
    });
}
function withTimeout(ms) { var c = new AbortController(); setTimeout(function () { c.abort(); }, ms); return c.signal; }

function loadPages() {
  fetch("pages.json")
    .then(function (r) { if (!r.ok) throw new Error("pages.json: HTTP " + r.status); return r.json(); })
    .then(function (o) {
      Object.keys(o).forEach(function (t) { pages[norm(t)] = { title: norm(t), text: o[t] }; });
      route();
      return true;
    })
    .catch(function () {
      view.innerHTML = "<h1>Wiki unavailable</h1><p>The page data (<code>pages.json</code>) couldn't be loaded. " +
        "If you run this wiki, check that <code>pages.json</code> is uploaded next to <code>index.html</code>.</p>";
      return false;
    })
    .then(function (ok) {
      if (!ok) return;
      // Edits and new pages from the server override the built-in ones.
      return getBackend()
        .then(function (b) { return fetch(b + "/pages", { signal: withTimeout(8000) }); })
        .then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); })
        .then(function (d) {
          (d.pages || []).forEach(function (p) { pages[norm(p.title)] = { title: norm(p.title), text: p.body, author: p.author }; });
          (d.deleted || []).forEach(function (t) { delete pages[norm(t)]; });
          route();
        })
        .catch(function () { backendUrl = null; statusEl.textContent = "Community edits are offline right now. You're seeing the saved version of the wiki."; });
    });
}

function tabs(title, active) {
  return '<div class="tabs"><a href="#' + slug(title) + '"' + (active === "page" ? ' aria-current="page"' : "") + '>Page</a>' +
         '<a href="#' + slug("Special:Edit/" + title) + '"' + (active === "edit" ? ' aria-current="page"' : "") + ">Edit</a></div>";
}

function viewPage(title) {
  var p = pages[title];
  if (!p) {
    view.innerHTML = tabs(title, "page") + "<h1>" + esc(title) + "</h1><p>This page doesn't exist yet.</p>" +
      '<a class="btn" href="#' + slug("Special:Edit/" + title) + '">Create this page</a>';
    return;
  }
  var r = render(p.text), cats = "";
  if (r.cats.length) cats = '<div class="cats">Categories: ' + r.cats.map(function (c) { return '<a href="#' + slug("Category:" + c) + '">' + esc(c) + "</a>"; }).join(", ") + "</div>";
  view.innerHTML = tabs(title, "page") + "<h1>" + esc(title) + "</h1>" + r.html + cats +
    (p.author ? '<p class="help">Last edited by ' + esc(p.author) + ".</p>" : "");
}

function listPages(heading, titles, asCards) {
  titles.sort();
  var html = "<h1>" + esc(heading) + "</h1>";
  if (!titles.length) html += "<p>No pages here yet.</p>";
  else if (asCards) html += titles.map(function (t) {
    return '<div class="card"><a class="head" href="#' + slug(t) + '">' + esc(t) + "</a></div>"; }).join("");
  else html += "<ul>" + titles.map(function (t) { return '<li><a href="#' + slug(t) + '">' + esc(t) + "</a></li>"; }).join("") + "</ul>";
  view.innerHTML = html;
}

function viewSearch(q) {
  var res = searchPages(q);
  view.innerHTML = "<h1>Search</h1><p class=\"help\">" + res.length + " result" + (res.length === 1 ? "" : "s") + " for \u201c" + esc(q) + "\u201d</p>" +
    res.map(function (r) {
      return '<div class="card"><a class="head" href="#' + slug(r.title) + '">' + esc(r.title) + "<small>" + esc(r.cats[0] || "") + "</small></a>" +
             '<div class="body">' + r.snippet + "</div></div>";
    }).join("");
}

function viewNewPage() {
  view.innerHTML = '<h1>Add a page</h1><label>Page title<input id="np-title" maxlength="60"></label><button class="btn" id="np-go" type="button">Start writing</button>';
  function go() { var t = document.getElementById("np-title").value.trim(); if (t) location.hash = "#" + slug("Special:Edit/" + t); }
  document.getElementById("np-go").onclick = go;
  document.getElementById("np-title").onkeydown = function (e) { if (e.key === "Enter") go(); };
}

function viewEditor(title) {
  var p = pages[title];
  view.innerHTML = tabs(title, "edit") + "<h1>Editing " + esc(title) + "</h1>" +
    '<label>Page text<textarea id="ed-text" rows="18" maxlength="20000"></textarea></label>' +
    '<label>Your name (optional)<input id="ed-author" maxlength="30"></label>' +
    '<button class="btn" id="ed-preview" type="button">Preview</button><button class="btn" id="ed-save" type="button">Submit for review</button>' +
    '<p id="ed-status" class="help" role="status"></p><div class="preview" id="ed-box"></div>' +
    '<p class="help">Formatting: <code>== Heading ==</code> <code>\'\'\'bold\'\'\'</code> <code>\'\'italic\'\'</code> <code>[[Page]]</code> <code>[[Page|label]]</code> ' +
    '<code>* list</code> <code># numbered</code> <code>[[Category:Roles]]</code> <code>{{Infobox role|name=...|faction=...|color=#e60000}}</code>. Edits are checked by the team before they appear. To stop abuse, a scrambled version of your IP address is saved with your edit; the real address is never stored.</p>';
  var ta = document.getElementById("ed-text"), st = document.getElementById("ed-status");
  ta.value = p ? p.text : "";
  document.getElementById("ed-preview").onclick = function () {
    document.getElementById("ed-box").innerHTML = "<h1>" + esc(title) + "</h1>" + render(ta.value).html;
  };
  document.getElementById("ed-save").onclick = function () {
    if (!ta.value.trim()) { st.textContent = "Write something first."; return; }
    st.textContent = "Sending...";
    getBackend().then(function (b) {
      return fetch(b + "/pages", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: title, body: ta.value, author: document.getElementById("ed-author").value }) });
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) { st.textContent = x.ok ? "Thanks! Your edit was sent to the team for approval." : (x.d.error || "Something went wrong."); })
      .catch(function () { backendUrl = null; st.textContent = "The community server is offline right now. Try again later."; });
  };
}

function route() {
  var raw = ""; try { raw = decodeURIComponent((location.hash || "").replace(/^#\/?/, "")); } catch (e) {}
  var title = norm(raw || "Main Page"), m;
  if ((m = /^Special:Search\/(.*)$/i.exec(raw))) { title = "Special:Search"; viewSearch(m[1]); }
  else if ((m = /^Special:Edit\/(.+)$/.exec(title))) { title = norm(m[1]); viewEditor(title); }
  else if (title === "Special:AllPages") { listPages("All pages", Object.keys(pages).map(function (k) { return pages[k].title; }), false); }
  else if (title === "Special:NewPage") { viewNewPage(); }
  else if (/^Category:/.test(title)) {
    var c = norm(title.slice(9));
    listPages("Category: " + c, Object.keys(pages).filter(function (k) { return extractCats(pages[k].text).indexOf(c) >= 0; })
      .map(function (k) { return pages[k].title; }), true);
  } else { viewPage(title); }
  document.title = title + " | Mafia Wiki";
  Array.prototype.forEach.call(document.querySelectorAll("nav a"), function (a) {
    if (a.getAttribute("data-t") === title) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

var qEl = document.getElementById("q"), sugEl = document.getElementById("suggest");
function closeSuggest() { sugEl.innerHTML = ""; }
qEl.addEventListener("input", function () {
  var res = searchPages(qEl.value).slice(0, 6);
  sugEl.innerHTML = res.map(function (r) { return '<li><a href="#' + slug(r.title) + '">' + esc(r.title) + "</a></li>"; }).join("");
});
qEl.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && qEl.value.trim()) { closeSuggest(); location.hash = "#Special:Search/" + encodeURIComponent(qEl.value.trim()); }
  else if (e.key === "Escape") { closeSuggest(); }
});
document.addEventListener("click", function (e) { if (!e.target.closest(".search")) closeSuggest(); });
sugEl.addEventListener("click", function () { closeSuggest(); qEl.value = ""; });
loadPages();
</script>
</body>
</html>
